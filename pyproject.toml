[tool.poetry]
name = "pypg-iam"
version = "0.8.0"
description = "Python package for interacting with pg-iam"
authors = [
    "Leon du Toit <l.c.d.toit@usit.uio.no>",
    "Milen Kouylekov <milen.kouylekov@usit.uio.no>",
]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/unioslo/pypg-iam"
packages = [{include = "iam"}]

[tool.poetry.dependencies]
python = ">=3.9"
sqlalchemy = ">=1.4.22"
psycopg2 = ">=2.8.3"
psycopg = {version = ">=3.1.0", optional = true}
asyncpg = {version = ">=0.27.0", optional = true}

[tool.poetry.extras]
async = ["psycopg"]
async-asyncpg = ["asyncpg"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.3"
debugpy = "^1.6.3"
debugpy-run = "^1.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
